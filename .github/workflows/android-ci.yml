name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, Xray config, and live subscription smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBXRAY_VERSION: v26.11.9
      HEV_VERSION: 2.18.0
      NUSATUNNEL_SUBSCRIPTION_URL: https://raw.githubusercontent.com/barry-far/V2ray-Config/refs/heads/main/All_Configs_Sub.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Cache engine AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/libxray.aar
          key: libv2ray-${{ env.LIBXRAY_VERSION }}

      - name: Download AndroidLibXrayLite AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          test -s android/app/libs/libxray.aar

      - name: Cache HevSocks5Tunnel AAR
        id: hev-aar-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/hev-socks5-tunnel.aar
          key: hev-socks5-tunnel-${{ env.HEV_VERSION }}

      - name: Download HevSocks5Tunnel AAR
        if: steps.hev-aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/hev-socks5-tunnel.aar \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"

      - name: Verify HevSocks5Tunnel AAR checksum
        run: echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  android/app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Run Kotlin unit tests and live subscription smoke test
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Android release APKs (no publishing)
        working-directory: android
        run: gradle :app:assembleNusaRelease --no-daemon --stacktrace --warning-mode=summary

      - name: Report packaged APK sizes (per ABI and universal)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          outputs = Path("android/app/build/outputs/apk/nusaRelease")
          apks = sorted(outputs.glob("*.apk"))
          if not apks:
              raise SystemExit("No Nusa release APKs were produced")
          for apk in apks:
              mib = apk.stat().st_size / (1024 * 1024)
              print(f"{apk.name}: {mib:.2f} MiB")
          PY

      - name: Download matching Xray-core binary
        run: |
          curl -fL --retry 3 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${LIBXRAY_VERSION}/Xray-linux-64.zip"
          mkdir -p /tmp/xray-bin
          unzip -o /tmp/xray.zip xray -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          /tmp/xray-bin/xray version

      - name: Validate generated configs with Xray-core
        run: python3 ci/verify_xray_config.py /tmp/xray-bin/xray

  android-kvm-instrumentation:
    name: Compose UI instrumentation on KVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBXRAY_VERSION: v26.11.9
      HEV_VERSION: 2.18.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and x86_64 emulator image
        run: sdkmanager 'platform-tools' 'platforms;android-37' 'emulator' 'system-images;android-36;google_apis;x86_64'

      - name: Require a usable KVM device
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo '::error::/dev/kvm is missing; refusing to run Android without KVM acceleration.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          emulator -accel-check

      - name: Cache Android engine AARs
        id: engine-aars
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libxray.aar
            android/app/libs/hev-socks5-tunnel.aar
          key: engine-aars-${{ env.LIBXRAY_VERSION }}-${{ env.HEV_VERSION }}

      - name: Download Android engine AARs
        if: steps.engine-aars.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          curl -fL --retry 3 -o android/app/libs/hev-socks5-tunnel.aar \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"
          test -s android/app/libs/libxray.aar
          test -s android/app/libs/hev-socks5-tunnel.aar

      - name: Verify HevSocks5Tunnel AAR checksum
        run: echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  android/app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Run Android instrumentation tests on KVM emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -gpu swiftshader_indirect -accel on
          script: cd android && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-kvm-instrumentation-${{ github.run_id }}
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
