name: Android Release

# Build APK per-ABI + universal + .apks lalu publish ke GitHub Releases.
# Trigger: push tag v*  (contoh: git tag v2.2.1 && git push origin v2.2.1)
#          atau dijalankan manual dari tab Actions (Run workflow).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk membuat Release & upload asset

jobs:
  # ================== TES ==================
  # Semua rilis WAJIB lolos: unit test JVM + validasi config dengan
  # Xray-core ASLI (xray run -test) sebelum build APK dijalankan.
  test:
    name: Test (unit + config engine asli)
    runs-on: ubuntu-latest
    env:
      LIBXRAY_VERSION: v26.11.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Cache engine AAR
        id: aar-cache-test
        uses: actions/cache@v4
        with:
          path: android/app/libs/libxray.aar
          key: libv2ray-${{ env.LIBXRAY_VERSION }}

      - name: Download engine AAR (AndroidLibXrayLite)
        if: steps.aar-cache-test.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"

      # ---- 1. Unit test JVM (LinkParser / XrayConfigBuilder / SmartImporter)
      - name: Unit test Kotlin (JVM)
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload hasil test bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

      # ---- 2. Validasi config dengan engine Xray-core ASLI
      - name: Download Xray-core (engine yang sama dengan app)
        run: |
          curl -fL --retry 3 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${LIBXRAY_VERSION}/Xray-linux-64.zip"
          mkdir -p /tmp/xray-bin && cd /tmp/xray-bin
          unzip -o /tmp/xray.zip xray && chmod +x xray
          ./xray version

      - name: Validasi config builder dengan xray run -test
        run: python3 ci/verify_xray_config.py /tmp/xray-bin/xray

  # ================== BUILD & RELEASE ==================
  build-release:
    name: Build & Release APK
    needs: test   # rilis diblokir bila ada tes gagal
    runs-on: ubuntu-latest

    env:
      # Versi engine Xray (AndroidLibXrayLite) — harus cocok dengan kode app
      LIBXRAY_VERSION: v26.11.9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      # Engine Xray gobind (AAR, 60 MB) — di-cache biar build berikutnya cepat
      - name: Cache engine AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/libxray.aar
          key: libv2ray-${{ env.LIBXRAY_VERSION }}

      - name: Download engine AAR (AndroidLibXrayLite)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          ls -la android/app/libs/

      # Keystore rilis: pakai secret ANDROID_KEYSTORE_BASE64 bila ada (lebih aman),
      # jika tidak ada pakai keystore yang di-commit di repo.
      - name: Decode signing keystore (opsional dari secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/nusatunnel.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK per-ABI + universal + AAB
        working-directory: android
        run: |
          gradle :app:assembleNusaRelease :app:bundleNusaRelease \
            --no-daemon --stacktrace --warning-mode=summary

      # --------------------------------------------------------------- bundletool (.apks)

      - name: Download bundletool
        run: |
          # versi dipin langsung (tanpa API call -> bebas rate-limit 403)
          BT_VERSION=1.18.3
          curl -fL --retry 3 -o /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"

      - name: Build universal .apks dari AAB
        working-directory: android
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          java -jar /tmp/bundletool.jar build-apks \
            --mode=universal \
            --bundle=app/build/outputs/bundle/nusaRelease/app-nusaRelease.aab \
            --output="/tmp/NusaTunnel-v${VERSION}-universal.apks" \
            --ks=nusatunnel.keystore \
            --ks-key-alias=nusatunnel \
            --ks-pass=pass:nusatunnel2026

      # --------------------------------------------------------------- rename + checksum

      - name: Rapikan nama output & buat checksum
        working-directory: android/app/build/outputs/apk/nusaRelease
        run: |
          cp /tmp/NusaTunnel-v${VERSION}-universal.apks .
          # rename generik: app-<abi>-nusaRelease.apk -> NusaTunnel-v<ver>-<abi>.apk
          for f in app-*-nusaRelease.apk; do
            abi="${f#app-}"
            abi="${abi%-nusaRelease.apk}"
            mv "$f" "NusaTunnel-v${VERSION}-${abi}.apk"
          done
          sha256sum NusaTunnel-v${VERSION}-*.apk NusaTunnel-v${VERSION}-*.apks > SHA256SUMS.txt
          ls -la

      # --------------------------------------------------------------- release

      - name: Tentukan tag release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NusaTunnel ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${{ env.VERSION }}-arm64-v8a.apk
            android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${{ env.VERSION }}-armeabi-v7a.apk
            android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${{ env.VERSION }}-x86.apk
            android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${{ env.VERSION }}-x86_64.apk
            android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${{ env.VERSION }}-universal.apk
            android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${{ env.VERSION }}-universal.apks
            android/app/build/outputs/apk/nusaRelease/SHA256SUMS.txt
