name: Android Release

# Build APK per-ABI + universal + .apks, then create a DRAFT GitHub Release.
# Trigger only by pushing a v* tag after the exact main commit has green Android CI.
on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Verify release tag and main CI
    runs-on: ubuntu-latest
    steps:
      - name: Require current main head, matching version tag, and green Android CI
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = await github.rest.repos.getContent({
              owner, repo,
              path: "android/app/build.gradle.kts",
              ref: context.sha,
            });
            if (Array.isArray(source.data) || !source.data.content) {
              core.setFailed("Could not read Android versionName from the tagged source.");
              return;
            }
            const gradle = Buffer.from(source.data.content, "base64").toString("utf8");
            const version = gradle.match(/versionName\s*=\s*"([^"]+)"/)?.[1];
            if (!version || context.ref !== `refs/tags/v${version}`) {
              core.setFailed(`Tag must match app version v${version ?? "unknown"}.`);
              return;
            }

            const notesPath = `docs/release-notes-v${version}.md`;
            await github.rest.repos.getContent({ owner, repo, path: notesPath, ref: context.sha });
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: `v${version}` });
              core.setFailed(`Release v${version} already exists; increment version before releasing.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getContent({
                owner, repo, path: "android/nusatunnel.keystore", ref: context.sha,
              });
              core.setFailed("A release signing keystore is still tracked in the repository.");
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const main = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            if (main.data.commit.sha !== context.sha) {
              core.setFailed("Release tag must point exactly at the current main HEAD.");
              return;
            }

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: context.sha, per_page: 100,
            });
            const ciPassed = runs.data.workflow_runs.some(run =>
              run.name === "Android CI" &&
              run.event === "push" &&
              run.head_branch === "main" &&
              run.conclusion === "success"
            );
            if (!ciPassed) {
              core.setFailed("The tagged main commit has no successful Android CI push run.");
            }

  # ================== TES ==================
  # Semua rilis WAJIB lolos: unit test JVM + validasi config dengan
  # Xray-core ASLI (xray run -test) sebelum build APK dijalankan.
  test:
    name: Test (unit + config engine asli)
    needs: release-preflight
    runs-on: ubuntu-latest
    env:
      LIBXRAY_VERSION: v26.11.9
      HEV_VERSION: 2.18.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Cache engine AAR
        id: aar-cache-test
        uses: actions/cache@v4
        with:
          path: android/app/libs/libxray.aar
          key: libv2ray-${{ env.LIBXRAY_VERSION }}

      - name: Download engine AAR (AndroidLibXrayLite)
        if: steps.aar-cache-test.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"

      - name: Cache HevSocks5Tunnel AAR
        id: hev-aar-cache-test
        uses: actions/cache@v4
        with:
          path: android/app/libs/hev-socks5-tunnel.aar
          key: hev-socks5-tunnel-${{ env.HEV_VERSION }}

      - name: Download HevSocks5Tunnel AAR
        if: steps.hev-aar-cache-test.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/hev-socks5-tunnel.aar \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"

      - name: Verify HevSocks5Tunnel AAR checksum
        run: echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  android/app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      # ---- 1. Unit test JVM (LinkParser / XrayConfigBuilder / SmartImporter)
      - name: Unit test Kotlin (JVM)
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload hasil test bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

      # ---- 2. Validasi config dengan engine Xray-core ASLI
      - name: Download Xray-core (engine yang sama dengan app)
        run: |
          curl -fL --retry 3 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${LIBXRAY_VERSION}/Xray-linux-64.zip"
          mkdir -p /tmp/xray-bin && cd /tmp/xray-bin
          unzip -o /tmp/xray.zip xray && chmod +x xray
          ./xray version

      - name: Validasi config builder dengan xray run -test
        run: python3 ci/verify_xray_config.py /tmp/xray-bin/xray

  android-kvm-instrumentation:
    name: Compose UI instrumentation on KVM
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBXRAY_VERSION: v26.11.9
      HEV_VERSION: 2.18.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Install compile SDK and x86_64 emulator image
        run: sdkmanager 'platform-tools' 'platforms;android-37.1' 'build-tools;37.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'

      - name: Require a usable KVM device
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo '::error::/dev/kvm is missing; refusing to run Android without KVM acceleration.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check

      - name: Cache Android engine AARs
        id: engine-aars
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libxray.aar
            android/app/libs/hev-socks5-tunnel.aar
          key: engine-aars-${{ env.LIBXRAY_VERSION }}-${{ env.HEV_VERSION }}

      - name: Download Android engine AARs
        if: steps.engine-aars.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          curl -fL --retry 3 -o android/app/libs/hev-socks5-tunnel.aar \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"
          test -s android/app/libs/libxray.aar
          test -s android/app/libs/hev-socks5-tunnel.aar

      - name: Verify HevSocks5Tunnel AAR checksum
        run: echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  android/app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Run Android instrumentation tests on KVM emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -gpu swiftshader_indirect -accel on
          script: cd android && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-kvm-instrumentation-${{ github.run_id }}
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

  # ================== BUILD & RELEASE ==================
  build-release:
    name: Build & Prepare Draft Release
    needs: [release-preflight, test, android-kvm-instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Versi engine Xray (AndroidLibXrayLite) — harus cocok dengan kode app
      LIBXRAY_VERSION: v26.11.9
      HEV_VERSION: 2.18.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Setup Android SDK for signed install smoke test
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Install Android build tools and KVM emulator image
        run: |
          sdkmanager 'platform-tools' 'platforms;android-37.1' 'build-tools;37.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          if [[ ! -e /dev/kvm ]]; then
            echo '::error::/dev/kvm is missing; refusing to skip signed install/update verification.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check

      # Engine Xray gobind (AAR, 60 MB) — di-cache biar build berikutnya cepat
      - name: Cache engine AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/libxray.aar
          key: libv2ray-${{ env.LIBXRAY_VERSION }}

      - name: Download engine AAR (AndroidLibXrayLite)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/libxray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          ls -la android/app/libs/

      - name: Cache HevSocks5Tunnel AAR
        id: hev-aar-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/hev-socks5-tunnel.aar
          key: hev-socks5-tunnel-${{ env.HEV_VERSION }}

      - name: Download HevSocks5Tunnel AAR
        if: steps.hev-aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/hev-socks5-tunnel.aar \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"

      - name: Verify HevSocks5Tunnel AAR checksum
        run: echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  android/app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Require rotated signing secrets and prepare private keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_KEY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required; refusing to use the exposed repository keystore."
              exit 1
            fi
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/nusatunnel-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          if [[ -z "${EXPECTED_CERT_SHA256:-}" ]]; then
            echo '::error::Set the non-secret repository variable ANDROID_KEY_CERT_SHA256 before releasing.'
            exit 1
          fi
          keystore_digest="$(keytool -list -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected_digest="$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | sed -E 's/^[[:space:]]*[sS][hH][aA]256[[:space:]]*[:=][[:space:]]*//' \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$keystore_digest" || "$keystore_digest" != "$expected_digest" ]]; then
            echo "::error::Configured signing keystore does not match the expected certificate fingerprint. Expected ${expected_digest:-missing}; keystore ${keystore_digest:-missing}."
            exit 1
          fi
          echo 'Configured signing certificate fingerprint verified.'
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/nusatunnel-store-password"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/nusatunnel-key-password"
          chmod 600 "$KEYSTORE_PATH" "$RUNNER_TEMP/nusatunnel-store-password" "$RUNNER_TEMP/nusatunnel-key-password"
          echo "NUSATUNNEL_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build APK per-ABI + universal + AAB
        working-directory: android
        env:
          NUSATUNNEL_SIGNING_STORE_FILE: ${{ runner.temp }}/nusatunnel-release.p12
          NUSATUNNEL_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NUSATUNNEL_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NUSATUNNEL_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NUSATUNNEL_REQUIRE_RELEASE_SIGNING: 'true'
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$NUSATUNNEL_SIGNING_KEY_PASSWORD" ]]; then
            echo '::error::ANDROID_KEY_PASSWORD is required.'
            exit 1
          fi
          gradle :app:assembleNusaRelease :app:bundleNusaRelease \
            --no-daemon --no-build-cache --no-configuration-cache \
            --stacktrace --warning-mode=summary

      - name: Verify APK signatures use the rotated certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_KEY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
            echo '::error::Set the non-secret repository variable ANDROID_KEY_CERT_SHA256 before releasing.'
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo '::error::Android SDK root was not configured.'
            exit 1
          fi
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$APKSIGNER" ]]; then
            echo '::error::apksigner was not found in the Android SDK.'
            exit 1
          fi
          expected_raw="$(printf '%s' "$EXPECTED_CERT_SHA256" | sed -E 's/^[[:space:]]*[sS][hH][aA]256[[:space:]]*[:=][[:space:]]*//')"
          expected="$(printf '%s' "$expected_raw" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_KEY_CERT_SHA256 must normalize to exactly 64 hexadecimal characters; got ${expected:-empty}."
            exit 1
          fi
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/nusaRelease/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo '::error::No release APKs were produced.'
            exit 1
          fi
          for apk in "${apks[@]}"; do
            output="$("$APKSIGNER" verify --print-certs "$apk")"
            actual_raw="$(printf '%s\n' "$output" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}')"
            actual="$(printf '%s' "$actual_raw" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$actual" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
              echo "::error::Signature certificate mismatch for $(basename "$apk"). Expected SHA-256=${expected:-missing}; APK signer SHA-256=${actual:-unparsed}."
              if [[ -z "$actual" ]]; then
                echo "::error::apksigner output: ${output:-<empty>}"
              fi
              exit 1
            fi
            echo "Verified rotated signing certificate SHA-256=${actual}: $(basename "$apk")"
          done

      # --------------------------------------------------------------- bundletool (.apks)

      - name: Download bundletool
        run: |
          # versi dipin langsung (tanpa API call -> bebas rate-limit 403)
          BT_VERSION=1.18.3
          curl -fL --retry 3 -o /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"

      - name: Build universal .apks dari AAB
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          java -jar /tmp/bundletool.jar build-apks \
            --mode=universal \
            --bundle=app/build/outputs/bundle/nusaRelease/app-nusaRelease.aab \
            --output="/tmp/NusaTunnel-v${VERSION}-universal.apks" \
            --ks="$RUNNER_TEMP/nusatunnel-release.p12" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --ks-pass="file:$RUNNER_TEMP/nusatunnel-store-password" \
            --key-pass="file:$RUNNER_TEMP/nusatunnel-key-password"

      # --------------------------------------------------------------- rename + checksum

      - name: Rapikan nama output & buat checksum
        working-directory: android/app/build/outputs/apk/nusaRelease
        run: |
          cp /tmp/NusaTunnel-v${VERSION}-universal.apks .
          # rename generik: app-<abi>-nusaRelease.apk -> NusaTunnel-v<ver>-<abi>.apk
          for f in app-*-nusaRelease.apk; do
            abi="${f#app-}"
            abi="${abi%-nusaRelease.apk}"
            mv "$f" "NusaTunnel-v${VERSION}-${abi}.apk"
          done
          sha256sum NusaTunnel-v${VERSION}-*.apk NusaTunnel-v${VERSION}-*.apks > SHA256SUMS.txt
          ls -la

      - name: Prepare signed install/update smoke-test script
        run: |
          cat > "$RUNNER_TEMP/android-install-smoke.sh" <<'BASH'
          set -euo pipefail
          package_name=com.nusa.tunnel
          old_apk="$RUNNER_TEMP/NusaTunnel-v2.2.5-universal.apk"
          old_sums="$RUNNER_TEMP/v2.2.5-SHA256SUMS.txt"
          new_apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/nusaRelease/NusaTunnel-v${VERSION}-universal.apk"
          curl -fL --retry 3 -o "$old_apk" "https://github.com/XbibzOfficial777/NusaTunnel/releases/download/v2.2.5/NusaTunnel-v2.2.5-universal.apk"
          curl -fL --retry 3 -o "$old_sums" "https://github.com/XbibzOfficial777/NusaTunnel/releases/download/v2.2.5/SHA256SUMS.txt"
          expected_old="$(awk '$2 == "NusaTunnel-v2.2.5-universal.apk" {print $1; exit}' "$old_sums")"
          actual_old="$(sha256sum "$old_apk" | awk '{print $1}')"
          if [[ -z "$expected_old" || "$actual_old" != "$expected_old" ]]; then
            echo '::error::The published v2.2.5 universal APK failed its release checksum.'
            exit 1
          fi
          adb install "$old_apk"
          old_info="$(adb shell dumpsys package "$package_name" | grep -m 1 -E 'versionName=2\.2\.5([[:space:]]|$)' || true)"
          if [[ -z "$old_info" ]]; then
            echo '::error::The sideloaded test APK does not report versionName 2.2.5.'
            exit 1
          fi
          echo "Installed legacy package: $old_info"
          if update_output="$(adb install -r "$new_apk" 2>&1)"; then
            echo '::error::Android unexpectedly accepted an in-place update from sideloaded v2.2.5.'
            exit 1
          fi
          if ! grep -q 'INSTALL_FAILED_UPDATE_INCOMPATIBLE' <<<"$update_output"; then
            echo '::error::Update was rejected for an unexpected reason:'
            printf '%s\n' "$update_output"
            exit 1
          fi
          echo 'Confirmed v2.2.5 cannot update in place after signing-key rotation.'
          adb uninstall "$package_name"
          adb install "$new_apk"
          new_info="$(adb shell dumpsys package "$package_name" | grep -m 1 -E 'versionCode=8([[:space:]]|$)' || true)"
          if [[ -z "$new_info" ]]; then
            echo '::error::The v2.2.7 APK did not clean-install as versionCode 8.'
            exit 1
          fi
          echo "Installed release package: $new_info"
          adb shell monkey -p "$package_name" -c android.intent.category.LAUNCHER 1
          for attempt in {1..10}; do
            if adb shell pidof "$package_name" | grep -qE '[0-9]'; then
              echo 'Confirmed v2.2.7 clean install and launcher start on KVM.'
              exit 0
            fi
            sleep 1
          done
          echo '::error::The installed v2.2.7 app did not remain running after launch.'
          exit 1
          BASH
          chmod 700 "$RUNNER_TEMP/android-install-smoke.sh"

      - name: Smoke-test Android install and update behavior on KVM
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -gpu swiftshader_indirect -accel on
          script: bash "$RUNNER_TEMP/android-install-smoke.sh"

      # --------------------------------------------------------------- release

      - name: Confirm version tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo '::error::Release tag and app version differ.'
            exit 1
          fi
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NusaTunnel ${{ env.VERSION }}
          draft: true
          prerelease: false
          body_path: docs/release-notes-v${{ env.VERSION }}.md
          generate_release_notes: false
